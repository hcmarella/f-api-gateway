# Test-only services. NEVER merge this into docker-compose.yml — Neo4j here
# exists purely to benchmark pgvector vs. a graph DB for retrieval; it is not
# part of the product's runtime architecture.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d neo4j-test

services:
  neo4j-test:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/testpassword123
      NEO4J_PLUGINS: '[]'
    ports:
      - "7475:7474"
      - "7688:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
